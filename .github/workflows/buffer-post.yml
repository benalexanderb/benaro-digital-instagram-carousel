name: Buffer-Post einreihen

# Die Claude-Routine erzeugt die Slides und pusht sie zusammen mit einer
# post.json nach main. Sie kann Buffer selbst nicht erreichen (Egress-Policy
# der Sandbox blockt buffer.com). Dieser Workflow uebernimmt deshalb den
# Buffer-Teil auf einem GitHub-Runner mit freiem Netz.

on:
  push:
    branches: [main]
    paths:
      - 'output/**/post.json'
  workflow_dispatch:
    inputs:
      dir:
        description: 'Carousel-Ordner, z.B. output/carousel_2026-08-23 (leer = juengster offener)'
        required: false
        default: ''
      dry_run:
        description: 'Nur pruefen, nicht posten'
        type: boolean
        required: false
        default: true

concurrency:
  group: buffer-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post bei Buffer einreihen
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          INPUT_DIR: ${{ github.event.inputs.dir }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${INPUT_DIR:-}" ]; then
            ARGS+=(--dir "$INPUT_DIR")
          fi
          if [ "${INPUT_DRY_RUN:-}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 scripts/buffer_post.py "${ARGS[@]}"

      - name: Marker zurueckpushen
        if: success()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain output)" ]; then
            echo "Nichts zu committen."
            exit 0
          fi
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add output
          git commit -m "Buffer: Post eingereiht (posted.json)"
          git push origin HEAD:main
